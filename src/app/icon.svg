<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Icono de la pestaña. Usa la gema dorada del catálogo, no el monograma
    "JDS": tres letras a 16 píxeles se vuelven una mancha, mientras que la
    silueta de la gema sobre el verde de la marca se distingue de un vistazo
    entre otras pestañas.
  -->
  <rect width="32" height="32" rx="7" fill="#0c2318"/>
  <path d="M16 3 L27 13.5 L16 29 L5 13.5 Z" fill="#c9a24a"/>
  <path d="M16 3 L16 29 M5 13.5 L27 13.5" stroke="#0c2318" stroke-width="1.2" stroke-opacity="0.4"/>
</svg>
